<body>
<div id="versionView">v0</div>
	
  <h1>학생 활동 조회 사이트</h1>

  <div class="box">
    <h2>학생 조회</h2>
    <input type="text" id="searchId" placeholder="학번 입력">
    <button onclick="searchStudent()">조회</button>
    <div id="result"></div>
  </div>

<button id="adminOpenBtn" onclick="showAdminLogin()">관리자</button>

<div id="adminLoginBox" class="box hidden">

</div>

<div id="adminPage" class="box hidden">
  <h2>관리자 화면</h2>

  <details open>
    <summary>1. 엑셀, 백업 관리</summary>

    <h3>엑셀 업로드</h3>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <button onclick="uploadExcel()">엑셀 미리보기</button>

    <h3>현재 데이터 엑셀 다운로드</h3>
    <button onclick="downloadBackupExcel()">현재 데이터 엑셀 다운로드</button>

  <details>
    <summary>2. 학생, 활동 관리</summary>

    <div class="data-grid">

        <h3>활동 삭제</h3>

  <details>

      <option value="">활동 선택</option>
    </select>

    <select id="removeActivityInput">

    </select>
    <input type="text" id="removeActivityStudentId" placeholder="학생 학번">

    </select>

  <details>

    </div>

  <details>
    <summary>5. 현재 데이터 보기</summary>

    <h3>현재 데이터</h3>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPDjTDGJnnYooEFynHEXR8uI-V-xa-Bcs",
      authDomain: "project-7536310801310810250.firebaseapp.com",

      projectId: "project-7536310801310810250",
      storageBucket: "project-7536310801310810250.firebasestorage.app",
      messagingSenderId: "178145722215",
      appId: "1:178145722215:web:eda1e0b8cbc47bfcb379c2",
      measurementId: "G-3SQFB6YNJZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    
    let students = {};
    let activities = {};
	let dataVersion = 0;

	 let lastSearchedActivity = "";
	  
    async function loadData() {
      const snapshot = await get(ref(db, "/"));

      if (snapshot.exists()) {
        const data = snapshot.val();
        students = data.students || {};
        activities = data.activities || {};
		dataVersion = data.dataVersion || 0;
		showVersion();
      } else {
        students = {};
        activities = {};
        await saveData();
      }
      lastSavedState = cloneData({
		  students: students,
		  activities: activities
	  });
		loadHistoryFromBrowser();
		showData();
		
    }

    let undoStack = [];
		let redoStack = [];
    let lastSavedState = null;

function cloneData(data) {
  return JSON.parse(JSON.stringify(data));
}

function saveHistoryToBrowser() {
  localStorage.setItem("undoStack", JSON.stringify(undoStack));
  localStorage.setItem("redoStack", JSON.stringify(redoStack));
}

function loadHistoryFromBrowser() {
  undoStack = JSON.parse(localStorage.getItem("undoStack") || "[]");
  redoStack = JSON.parse(localStorage.getItem("redoStack") || "[]");
}
	  
async function saveData(recordUndo = true) {
  if (recordUndo && lastSavedState) {
    undoStack.push(cloneData(lastSavedState));
    redoStack = [];
    saveHistoryToBrowser();
  }
	
	dataVersion++;
	
	await set(ref(db, "dataVersion"), dataVersion);
  await set(ref(db, "students"), students);
  await set(ref(db, "activities"), activities);
	showVersion();
	
  lastSavedState = cloneData({
    students: students,
    activities: activities
  });
}

 function showVersion() {
  const view = document.getElementById("versionView");
  if (!view) return;

  view.innerHTML = `v${dataVersion}`;
}

function safeActivityName(name) {
  return String(name)
    .trim()
    .replace(/\./g, "．")
    .replace(/#/g, "＃")
    .replace(/\$/g, "＄")
    .replace(/\//g, "／")
    .replace(/\[/g, "［")
    .replace(/\]/g, "］")
    .replace(/\s+/g, " ");
}

let pendingUpload = null;

window.uploadExcel = async function () {
  const fileInput = document.getElementById("excelFile");
  const preview = document.getElementById("excelPreview");
  const file = fileInput.files[0];

  if (!file) {
    alert("엑셀 파일을 선택하세요.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (e) {
    try {
      if (!window.XLSX) {
        alert("엑셀 라이브러리를 불러오지 못했습니다.");
        return;
      }

      const data = new Uint8Array(e.target.result);
      const workbook = window.XLSX.read(data, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      const rows = window.XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      let headerRowIndex = -1;
      let classCol = -1;
      let numberCol = -1;
      let nameCol = -1;

      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < rows[r].length; c++) {
          const value = String(rows[r][c]).trim();

          if (value === "반" || value === "학급") classCol = c;
          if (value === "번호" || value === "학번") numberCol = c;
          if (value === "이름" || value === "성명") nameCol = c;
        }

        if (numberCol !== -1 && nameCol !== -1) {
          headerRowIndex = r;
          break;
        }
      }

      if (headerRowIndex === -1) {
        alert("엑셀에서 번호/학번, 이름 열을 찾지 못했습니다.");
        return;
      }

      const headerRow = rows[headerRowIndex];

      let newStudents = {};
      let newActivities = {};

      for (let c = nameCol + 1; c < headerRow.length; c++) {
        const activityName = safeActivityName(headerRow[c]);

        if (activityName !== "") {
          newActivities[activityName] = ["__EMPTY__"];
        }
      }

      for (let r = headerRowIndex + 1; r < rows.length; r++) {
        const row = rows[r];

        const studentNumber = String(row[numberCol]).trim();
        const studentName = String(row[nameCol]).trim();

        if (studentNumber === "" || studentName === "") continue;

        let studentId = "";

        if (classCol !== -1 && String(row[classCol]).trim() !== "") {
          const classNumber = String(row[classCol]).trim();
          const paddedNumber = studentNumber.padStart(2, "0");
          studentId = `3${classNumber}${paddedNumber}`;
        } else {
          studentId = studentNumber;
        }

        newStudents[studentId] = studentName;

        for (let c = nameCol + 1; c < headerRow.length; c++) {
          const activityName = safeActivityName(headerRow[c]);
          const cellValue = String(row[c]).trim();

          if (activityName === "") continue;

          if (cellValue !== "") {
            newActivities[activityName] =
              newActivities[activityName].filter(x => x !== "__EMPTY__");

            if (!newActivities[activityName].includes(studentId)) {
              newActivities[activityName].push(studentId);
            }
          }
        }
      }

pendingUpload = {
  students: newStudents,
  activities: newActivities
};

let newStudentCount = 0;
let changedNames = [];
let newActivityNames = [];
let newApplyCount = 0;
let duplicateApplyCount = 0;

for (let id in newStudents) {
  if (!students[id]) {
    newStudentCount++;
  }

  if (students[id] && students[id] !== newStudents[id]) {
    changedNames.push(`${id}: ${students[id]} → ${newStudents[id]}`);
  }
}

for (let activity in newActivities) {
  if (!activities[activity]) {
    newActivityNames.push(activity);
  }

  const ids = newActivities[activity].filter(id => id !== "__EMPTY__");

  ids.forEach(id => {
    if (activities[activity] && activities[activity].includes(id)) {
      duplicateApplyCount++;
    } else {
      newApplyCount++;
    }
  });
}

const changedNamePreview = changedNames.length > 0
  ? changedNames.slice(0, 30).map(x => `<li>${x}</li>`).join("")
  : "<li>없음</li>";

const newActivityPreview = newActivityNames.length > 0
  ? newActivityNames.slice(0, 30).map(x => `<li>${x}</li>`).join("")
  : "<li>없음</li>";

preview.innerHTML = `
  <div class="box">
    <h4>엑셀 업로드 미리보기</h4>

    <p>전체 학생 수: ${Object.keys(newStudents).length}명</p>
    <p>전체 활동 수: ${Object.keys(newActivities).length}개</p>
    <p>신규 학생: ${newStudentCount}명</p>
    <p>이름 변경 예정: ${changedNames.length}명</p>
    <p>신규 활동: ${newActivityNames.length}개</p>
    <p>새로 추가될 신청 기록: ${newApplyCount}건</p>
    <p>중복으로 제외될 신청 기록: ${duplicateApplyCount}건</p>

    <details>
      <summary>이름 변경 예정 학생 보기</summary>
      <ul>${changedNamePreview}</ul>
      ${changedNames.length > 30 ? `<p>외 ${changedNames.length - 30}건 더 있음</p>` : ""}
    </details>

    <details>
      <summary>신규 활동 보기</summary>
      <ul>${newActivityPreview}</ul>
      ${newActivityNames.length > 30 ? `<p>외 ${newActivityNames.length - 30}개 더 있음</p>` : ""}
    </details>

    <br>
    <button onclick="confirmExcelUpload()">이 데이터 반영</button>
    <button onclick="cancelExcelUpload()">취소</button>
  </div>
`;

    } catch (err) {
      console.error(err);
      alert("엑셀 처리 중 오류 발생: " + err.message);
    }
  };

  reader.readAsArrayBuffer(file);
};

window.confirmExcelUpload = async function () {
  if (!pendingUpload) {
    alert("반영할 엑셀 데이터가 없습니다.");
    return;
  }

let changedNames = [];

for (let id in pendingUpload.students) {
  if (students[id] && students[id] !== pendingUpload.students[id]) {
    changedNames.push(
      `${id}: ${students[id]} → ${pendingUpload.students[id]}`
    );
  }
}

if (changedNames.length > 0) {
  const ok = confirm(
    `이미 등록된 학번 중 이름이 다른 학생이 있습니다.\n\n${changedNames.join("\n")}\n\n새 엑셀의 이름으로 변경할까요?`
  );

  if (!ok) {
    return;
  }
}

for (let id in pendingUpload.students) {
  students[id] = pendingUpload.students[id];
}

  for (let activity in pendingUpload.activities) {
    if (!activities[activity]) {
      activities[activity] = ["__EMPTY__"];
    }

    const newIds = pendingUpload.activities[activity].filter(id => id !== "__EMPTY__");

    if (newIds.length > 0) {
      activities[activity] = activities[activity].filter(id => id !== "__EMPTY__");

      newIds.forEach(id => {
        if (!activities[activity].includes(id)) {
          activities[activity].push(id);
        }
      });
    }
  }

  await saveData();
  showData();

  document.getElementById("excelPreview").innerHTML = "";
  document.getElementById("excelFile").value = "";
  pendingUpload = null;

  alert("엑셀 데이터가 반영되었습니다.");
};

window.cancelExcelUpload = function () {
  pendingUpload = null;
  document.getElementById("excelPreview").innerHTML = "";
  document.getElementById("excelFile").value = "";
};

window.searchStudent = function () {
  const id = document.getElementById("searchId").value.trim();
  const result = document.getElementById("result");

  if (!students[id]) {
    result.innerHTML = "<p>해당 학번의 학생을 찾을 수 없습니다.</p>";
    return;
  }

  let myActivities = [];

  for (let activity in activities) {
    if (activities[activity].includes(id)) {
      myActivities.push(activity);
    }
  }

  let html = `<h3>${students[id]} 학생</h3>`;
  html += `<p>학번: ${id}</p>`;
  html += `<h4>신청한 활동: 총 ${myActivities.length}개</h4>`;

  if (myActivities.length === 0) {
    html += "<p>신청한 활동이 없습니다.</p>";
  } else {
    html += "<ol>";
    myActivities.forEach(activity => {
      html += `<li>${activity}</li>`;
    });
    html += "</ol>";
  }

  result.innerHTML = html;
};

window.showAdminLogin = function () {
  document.getElementById("adminLoginBox").classList.remove("hidden");
  document.getElementById("adminPw").focus();
};
	  
window.loginAdmin = async function () {
  const pw = document.getElementById("adminPw").value.trim();

  try {
    const snapshot = await get(ref(db, "adminPassword"));
    const realPassword = String(snapshot.val()).trim();

if (pw === realPassword) {
  document.getElementById("adminLoginBox").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");
  showData();
}
	
	else {
      alert("관리자 비밀번호가 틀렸습니다.");
    }

  } catch (error) {
    console.error(error);
    alert("비밀번호 확인 실패");
  }
};

window.addStudent = async function () {
  const id = document.getElementById("studentId").value.trim();
  const name = document.getElementById("studentName").value.trim();

  if (id === "" || name === "") {
    alert("학번과 이름을 모두 입력하세요.");
    return;
  }

  if (students[id] && students[id] !== name) {
    const ok = confirm(
      `이미 등록된 학번입니다.\n\n기존: ${id} - ${students[id]}\n변경: ${id} - ${name}\n\n이름을 변경할까요?`
    );

    if (!ok) {
      return;
    }
  }

  students[id] = name;

  await saveData();
  showData();

  document.getElementById("studentId").value = "";
  document.getElementById("studentName").value = "";
};

    window.addActivity = async function () {
			const activity = safeActivityName(document.getElementById("activityName").value);

      if (activity === "") {
        alert("활동 이름을 입력하세요.");
        return;
      }

      if (!activities[activity]) {
        activities[activity] = ["__EMPTY__"];
      }

      await saveData();
      showData();

      document.getElementById("activityName").value = "";
    };

    window.addStudentToActivity = async function () {
      const activity = document.getElementById("activityInput").value.trim();
      const id = document.getElementById("activityStudentId").value.trim();

      if (activity === "") {
        alert("활동을 선택하세요.");
        return;
      }

      if (!students[id]) {
        alert("등록되지 않은 학번입니다.");
        return;
      }

      activities[activity] = activities[activity].filter(x => x !== "__EMPTY__");

      if (!activities[activity].includes(id)) {
        activities[activity].push(id);
      }

      await saveData();
      showData();

      document.getElementById("activityStudentId").value = "";
    };

    window.removeStudentFromActivity = async function () {
  const activity = document.getElementById("removeActivityInput").value.trim();
  const id = document.getElementById("removeActivityStudentId").value.trim();

  if (activity === "") {
    alert("활동을 선택하세요.");
    return;
  }

  if (id === "") {
    alert("삭제할 학생 학번을 입력하세요.");
    return;
  }

  if (!activities[activity]) {
    alert("존재하지 않는 활동입니다.");
    return;
  }

  if (!activities[activity].includes(id)) {
    alert("이 활동에 등록되지 않은 학생입니다.");
    return;
  }

  activities[activity] = activities[activity].filter(studentId => studentId !== id);

  if (activities[activity].length === 0) {
    activities[activity] = ["__EMPTY__"];
  }

  await saveData();
  showData();

  alert("활동에서 학생이 삭제되었습니다.");

  document.getElementById("removeActivityStudentId").value = "";
};
    
window.searchActivity = function () {
  const activity = document.getElementById("searchActivityName").value.trim();
  const resultDiv = document.getElementById("activitySearchResult");

  if (activity === "") {
    resultDiv.innerHTML = "<p>활동을 선택하세요.</p>";
    lastSearchedActivity = "";
    return;
  }

  const studentIds = activities[activity].filter(id => id !== "__EMPTY__");
  lastSearchedActivity = activity;

  let html = `<h4>${activity} 신청 학생 (총 ${studentIds.length}명)</h4>`;

  if (studentIds.length === 0) {
    html += "<p>신청한 학생이 없습니다.</p>";
  } else {
    html += `<button onclick="downloadActivityExcel()">이 활동 명단 엑셀 다운로드</button>`;
    html += "<ol>";

    studentIds.forEach(id => {
      const name = students[id] || "이름 없음";
      html += `<li>${id} - ${name}</li>`;
    });

    html += "</ol>";
  }

  resultDiv.innerHTML = html;
};

    window.deleteStudent = async function () {
      const id = document.getElementById("deleteStudentId").value.trim();

      if (!students[id]) {
        alert("존재하지 않는 학번입니다.");
        return;
      }

      if (!confirm(`${id} - ${students[id]} 학생을 삭제할까요?`)) {
        return;
      }

      delete students[id];

      for (let activity in activities) {
        activities[activity] = activities[activity].filter(studentId => studentId !== id);

        if (activities[activity].length === 0) {
          activities[activity] = ["__EMPTY__"];
        }
      }

      await saveData();
      showData();

      alert("학생이 삭제되었습니다.");
      document.getElementById("deleteStudentId").value = "";
    };

    window.deleteActivity = async function () {
      const activity = document.getElementById("deleteActivityName").value.trim();

      if (activity === "") {
        alert("삭제할 활동 이름을 입력하세요.");
        return;
      }

      if (!activities[activity]) {
        alert("존재하지 않는 활동입니다.");
        return;
      }

      if (!confirm(`"${activity}" 활동을 삭제할까요?`)) {

      alert("활동이 삭제되었습니다.");

window.undoLastChange = async function () {
  if (undoStack.length === 0) {
    alert("뒤로갈 수 있는 이전 작업이 없습니다.");
    return;
  }

  redoStack.push(cloneData({
    students: students,
    activities: activities
  }));

  const previous = undoStack.pop();

  students = previous.students || {};
  activities = previous.activities || {};

  await set(ref(db, "students"), students);
  await set(ref(db, "activities"), activities);

  lastSavedState = cloneData({
    students: students,
    activities: activities
  });

  saveHistoryToBrowser();
  showData();

  alert("이전 작업으로 돌아갔습니다.");
};

window.downloadActivityExcel = function () {
  if (!lastSearchedActivity) {
    alert("먼저 활동을 검색하세요.");
    return;
  }

  const studentIds = activities[lastSearchedActivity].filter(id => id !== "__EMPTY__");

  if (studentIds.length === 0) {
    alert("다운로드할 학생이 없습니다.");
    return;
  }

  const rows = [["활동명", "학번", "이름"]];

  studentIds.forEach(id => {
    rows.push([
      lastSearchedActivity,
      id,
      students[id] || "이름 없음"
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

  XLSX.utils.book_append_sheet(wb, ws, "활동별 명단");

  const safeFileName = lastSearchedActivity
    .replace(/[\\/:*?"<>|]/g, "_")
    .slice(0, 30);

  XLSX.writeFile(wb, `${safeFileName}_명단.xlsx`);
};
	  
window.downloadBackupExcel = function () {
  const studentRows = [["학번", "이름", "신청 활동"]];

  for (let id in students) {
    let myActivities = [];

    for (let activity in activities) {
      if (activities[activity].includes(id)) {
        myActivities.push(activity);
      }
    }

    studentRows.push([
      id,
      students[id],
      myActivities.join(", ")
    ]);
  }

  const activityRows = [["활동명", "신청 학생 수", "신청 학번"]];

  for (let activity in activities) {
    const ids = activities[activity].filter(id => id !== "__EMPTY__");

    activityRows.push([
      activity,
      ids.length,
      ids.join(", ")
    ]);
  }

  const wb = XLSX.utils.book_new();

  const wsStudents = XLSX.utils.aoa_to_sheet(studentRows);
  const wsActivities = XLSX.utils.aoa_to_sheet(activityRows);

  XLSX.utils.book_append_sheet(wb, wsStudents, "학생별 활동");
  XLSX.utils.book_append_sheet(wb, wsActivities, "활동별 학생");

  XLSX.writeFile(wb, "학생활동_백업.xlsx");
};

function showData() {
  const dataView = document.getElementById("dataView");
  if (!dataView) return;

  let html = `
    <div class="data-grid">
      <div class="data-column">
        <h4>학생 목록</h4>
        <table>
          <tr>
            <th>학번</th>
            <th>이름</th>
          </tr>
  `;

  for (let id in students) {
    html += `
      <tr>
        <td>${id}</td>
        <td>${students[id]}</td>
      </tr>
    `;
  }

  html += `
        </table>
      </div>

      <div class="data-column">
        <h4>활동 목록</h4>
        <table>
          <tr>
            <th>활동명</th>
            <th>신청 학번</th>
          </tr>
  `;

  for (let activity in activities) {
    const ids = activities[activity].filter(id => id !== "__EMPTY__");

    html += `
      <tr>
        <td>${activity}</td>
        <td>${ids.length > 0 ? ids.join(", ") : "신청자 없음"}</td>
      </tr>
    `;
  }

  html += `
        </table>
      </div>
    </div>
  `;

  dataView.innerHTML = html;
  updateActivitySelects();
}

function updateActivitySelects() {
  const activityInput = document.getElementById("activityInput");
  const removeActivityInput = document.getElementById("removeActivityInput");
  const searchActivityName = document.getElementById("searchActivityName");

  if (!activityInput || !removeActivityInput || !searchActivityName) return;

  const selectedAddActivity = activityInput.value;
  const selectedRemoveActivity = removeActivityInput.value;
  const selectedSearchActivity = searchActivityName.value;

  activityInput.innerHTML = '<option value="">활동 선택</option>';
  removeActivityInput.innerHTML = '<option value="">활동 선택</option>';
  searchActivityName.innerHTML = '<option value="">활동 선택</option>';

  for (let activity in activities) {
    activityInput.innerHTML += `<option value="${activity}">${activity}</option>`;
    removeActivityInput.innerHTML += `<option value="${activity}">${activity}</option>`;
    searchActivityName.innerHTML += `<option value="${activity}">${activity}</option>`;
  }

  if (activities[selectedAddActivity]) {
    activityInput.value = selectedAddActivity;
  }

  if (activities[selectedRemoveActivity]) {
    removeActivityInput.value = selectedRemoveActivity;
  }

  if (activities[selectedSearchActivity]) {
    searchActivityName.value = selectedSearchActivity;
  }
}

function moveFocusOnEnter(inputId, nextInputId) {
  const input = document.getElementById(inputId);
  const nextInput = document.getElementById(nextInputId);

  if (!input || !nextInput) return;

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      nextInput.focus();
    }
  });
}
	  
function enterKey(inputId, actionFunction) {
  const input = document.getElementById(inputId);

  if (!input) return;

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      actionFunction();
    }
  });
}
