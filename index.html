<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학생 활동 조회</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    input, button, select {
      padding: 10px;
      margin: 5px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    li {
      margin: 7px 0;
    }

    .delete-grid,
    .reset-grid,
    .data-grid {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .delete-column,
    .reset-column,
    .data-column {
      flex: 1;
    }
  </style>
</head>
<body>

  <h1>학생 활동 조회 사이트</h1>

  <div class="box">
    <h2>학생 조회</h2>
    <input type="text" id="searchId" placeholder="학번 입력">
    <button onclick="searchStudent()">조회</button>
    <div id="result"></div>
  </div>

  <div class="box">
    <h2>관리자 로그인</h2>
    <input type="password" id="adminPw" placeholder="관리자 비밀번호">
    <button onclick="loginAdmin()">로그인</button>
  </div>

  <div id="adminPage" class="box hidden">
    <h2>관리자 화면</h2>

    <h3>엑셀 업로드</h3>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <button onclick="uploadExcel()">엑셀 데이터 불러오기</button>

    <h3>학생 추가</h3>
    <input type="text" id="studentId" placeholder="학번">
    <input type="text" id="studentName" placeholder="이름">
    <button onclick="addStudent()">학생 추가</button>

    <h3>활동 추가</h3>
    <input type="text" id="activityName" placeholder="활동 이름">
    <button onclick="addActivity()">활동 추가</button>

    <h3>활동에 학생 추가</h3>
    <select id="activityInput">
      <option value="">활동 선택</option>
    </select>
    <input type="text" id="activityStudentId" placeholder="학생 학번">
    <button onclick="addStudentToActivity()">신청 추가</button>

    <h3>활동별 학생 검색</h3>
    <select id="searchActivityName">
      <option value="">활동 선택</option>
    </select>
    <button onclick="searchActivity()">활동 검색</button>
    <div id="activitySearchResult"></div>

    <div class="delete-grid">
      <div class="delete-column">
        <h3>학생 삭제</h3>
        <input type="text" id="deleteStudentId" placeholder="삭제할 학번">
        <button onclick="deleteStudent()">학생 삭제</button>
      </div>

      <div class="delete-column">
        <h3>활동 삭제</h3>
        <input type="text" id="deleteActivityName" placeholder="삭제할 활동">
        <button onclick="deleteActivity()">활동 삭제</button>
      </div>
    </div>

    <div class="reset-grid">
      <div class="reset-column">
        <h3>학생 데이터 초기화</h3>
        <button onclick="resetStudents()">학생 전체 삭제</button>
      </div>

      <div class="reset-column">
        <h3>활동 데이터 초기화</h3>
        <button onclick="resetActivities()">활동 전체 삭제</button>
      </div>
    </div>

    <h3>현재 데이터</h3>
    <div id="dataView"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPDjTDGJnnYooEFynHEXR8uI-V-xa-Bcs",
      authDomain: "project-7536310801310810250.firebaseapp.com",
      databaseURL: "https://project-7536310801310810250-default-rtdb.firebaseio.com",
      projectId: "project-7536310801310810250",
      storageBucket: "project-7536310801310810250.firebasestorage.app",
      messagingSenderId: "178145722215",
      appId: "1:178145722215:web:eda1e0b8cbc47bfcb379c2",
      measurementId: "G-3SQFB6YNJZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ADMIN_PASSWORD = "1234";

    let students = {};
    let activities = {};

    async function loadData() {
      const snapshot = await get(ref(db, "/"));

      if (snapshot.exists()) {
        const data = snapshot.val();
        students = data.students || {};
        activities = data.activities || {};
      } else {
        students = {};
        activities = {};
        await saveData();
      }

      showData();
    }

    async function saveData() {
      await set(ref(db, "/"), {
        students: students,
        activities: activities
      });
    }

    window.uploadExcel = async function () {
      const fileInput = document.getElementById("excelFile");
      const file = fileInput.files[0];

      if (!file) {
        alert("엑셀 파일을 선택하세요.");
        return;
      }

      if (!confirm("엑셀 데이터로 학생과 활동 정보를 새로 불러올까요? 기존 데이터는 덮어쓰기 됩니다.")) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: ""
        });

        let headerRowIndex = -1;
        let idCol = -1;
        let nameCol = -1;

        for (let r = 0; r < rows.length; r++) {
          let tempIdCol = -1;
          let tempNameCol = -1;

          for (let c = 0; c < rows[r].length; c++) {
            const value = String(rows[r][c]).trim();

            if (value === "번호" || value === "학번") {
              tempIdCol = c;
            }

            if (value === "이름" || value === "성명") {
              tempNameCol = c;
            }
          }

          if (tempIdCol !== -1 && tempNameCol !== -1) {
            headerRowIndex = r;
            idCol = tempIdCol;
            nameCol = tempNameCol;
            break;
          }
        }

        if (headerRowIndex === -1) {
          alert("엑셀에서 번호/학번과 이름 열을 찾을 수 없습니다.");
          return;
        }

        const header = rows[headerRowIndex];

        let newStudents = {};
        let newActivities = {};

        for (let c = nameCol + 1; c < header.length; c++) {
          const activityName = String(header[c]).trim();

          if (activityName !== "") {
            newActivities[activityName] = ["__EMPTY__"];
          }
        }

        for (let r = headerRowIndex + 1; r < rows.length; r++) {
          const row = rows[r];

          const studentId = String(row[idCol]).trim();
          const studentName = String(row[nameCol]).trim();

          if (studentId === "" || studentName === "") {
            continue;
          }

          newStudents[studentId] = studentName;

          for (let c = nameCol + 1; c < header.length; c++) {
            const activityName = String(header[c]).trim();
            const checked = String(row[c]).trim();

            if (activityName === "") {
              continue;
            }

            if (checked !== "") {
              newActivities[activityName] = newActivities[activityName].filter(x => x !== "__EMPTY__");

              if (!newActivities[activityName].includes(studentId)) {
                newActivities[activityName].push(studentId);
              }
            }
          }
        }

        students = newStudents;
        activities = newActivities;

        await saveData();
        showData();

        alert("엑셀 데이터 업로드가 완료되었습니다.");
        fileInput.value = "";
      };

      reader.readAsArrayBuffer(file);
    };

    window.searchStudent = function () {
      const id = document.getElementById("searchId").value.trim();
      const result = document.getElementById("result");

      if (!students[id]) {
        result.innerHTML = "<p>해당 학번의 학생을 찾을 수 없습니다.</p>";
        return;
      }

      let myActivities = [];

      for (let activity in activities) {
        if (activities[activity].includes(id)) {
          myActivities.push(activity);
        }
      }

      let html = `<h3>${students[id]} 학생</h3>`;
      html += `<p>학번: ${id}</p>`;
      html += `<h4>신청한 활동</h4>`;

      if (myActivities.length === 0) {
        html += "<p>신청한 활동이 없습니다.</p>";
      } else {
        html += "<ul>";
        myActivities.forEach(activity => {
          html += `<li>${activity}</li>`;
        });
        html += "</ul>";
      }

      result.innerHTML = html;
    };

    window.loginAdmin = function () {
      const pw = document.getElementById("adminPw").value;

      if (pw === ADMIN_PASSWORD) {
        document.getElementById("adminPage").classList.remove("hidden");
        showData();
      } else {
        alert("관리자 비밀번호가 틀렸습니다.");
      }
    };

    window.addStudent = async function () {
      const id = document.getElementById("studentId").value.trim();
      const name = document.getElementById("studentName").value.trim();

      if (id === "" || name === "") {
        alert("학번과 이름을 모두 입력하세요.");
        return;
      }

      students[id] = name;

      await saveData();
      showData();

      document.getElementById("studentId").value = "";
      document.getElementById("studentName").value = "";
    };

    window.addActivity = async function () {
      const activity = document.getElementById("activityName").value.trim();

      if (activity === "") {
        alert("활동 이름을 입력하세요.");
        return;
      }

      if (!activities[activity]) {
        activities[activity] = ["__EMPTY__"];
      }

      await saveData();
      showData();

      document.getElementById("activityName").value = "";
    };

    window.addStudentToActivity = async function () {
      const activity = document.getElementById("activityInput").value.trim();
      const id = document.getElementById("activityStudentId").value.trim();

      if (activity === "") {
        alert("활동을 선택하세요.");
        return;
      }

      if (!students[id]) {
        alert("등록되지 않은 학번입니다.");
        return;
      }

      activities[activity] = activities[activity].filter(x => x !== "__EMPTY__");

      if (!activities[activity].includes(id)) {
        activities[activity].push(id);
      }

      await saveData();
      showData();

      document.getElementById("activityInput").value = "";
      document.getElementById("activityStudentId").value = "";
    };

    window.searchActivity = function () {
      const activity = document.getElementById("searchActivityName").value.trim();
      const resultDiv = document.getElementById("activitySearchResult");

      if (activity === "") {
        resultDiv.innerHTML = "<p>활동을 선택하세요.</p>";
        return;
      }

      const studentIds = activities[activity].filter(id => id !== "__EMPTY__");

      let html = `<h4>${activity} 신청 학생 (총 ${studentIds.length}명)</h4>`;

      if (studentIds.length === 0) {
        html += "<p>신청한 학생이 없습니다.</p>";
      } else {
        html += "<ul>";
        studentIds.forEach(id => {
          const name = students[id] || "이름 없음";
          html += `<li>${id} - ${name}</li>`;
        });
        html += "</ul>";
      }

      resultDiv.innerHTML = html;
    };

    window.deleteStudent = async function () {
      const id = document.getElementById("deleteStudentId").value.trim();

      if (!students[id]) {
        alert("존재하지 않는 학번입니다.");
        return;
      }

      if (!confirm(`${id} - ${students[id]} 학생을 삭제할까요?`)) {
        return;
      }

      delete students[id];

      for (let activity in activities) {
        activities[activity] = activities[activity].filter(studentId => studentId !== id);

        if (activities[activity].length === 0) {
          activities[activity] = ["__EMPTY__"];
        }
      }

      await saveData();
      showData();

      alert("학생이 삭제되었습니다.");
      document.getElementById("deleteStudentId").value = "";
    };

    window.deleteActivity = async function () {
      const activity = document.getElementById("deleteActivityName").value.trim();

      if (activity === "") {
        alert("삭제할 활동 이름을 입력하세요.");
        return;
      }

      if (!activities[activity]) {
        alert("존재하지 않는 활동입니다.");
        return;
      }

      if (!confirm(`"${activity}" 활동을 삭제할까요?`)) {
        return;
      }

      delete activities[activity];

      await saveData();
      showData();

      alert("활동이 삭제되었습니다.");
      document.getElementById("deleteActivityName").value = "";
    };

    window.resetStudents = async function () {
      if (!confirm("모든 학생 데이터를 삭제할까요?")) {
        return;
      }

      students = {};

      for (let activity in activities) {
        activities[activity] = ["__EMPTY__"];
      }

      await saveData();
      showData();

      alert("모든 학생 데이터가 삭제되었습니다.");
    };

    window.resetActivities = async function () {
      if (!confirm("모든 활동 데이터를 삭제할까요?")) {
        return;
      }

      activities = {};

      await saveData();
      showData();

      alert("모든 활동 데이터가 삭제되었습니다.");
    };

    function showData() {
      const dataView = document.getElementById("dataView");
      if (!dataView) return;

      let html = `
        <div class="data-grid">
          <div class="data-column">
            <h4>학생 목록</h4>
            <ul>
      `;

      for (let id in students) {
        html += `<li>${id} - ${students[id]}</li>`;
      }

      html += `
            </ul>
          </div>

          <div class="data-column">
            <h4>활동 목록</h4>
            <ul>
      `;

      for (let activity in activities) {
        const ids = activities[activity].filter(id => id !== "__EMPTY__");
        html += `<li>${activity}: ${ids.length > 0 ? ids.join(", ") : "신청자 없음"}</li>`;
      }

      html += `
            </ul>
          </div>
        </div>
      `;

      dataView.innerHTML = html;
      updateActivitySelects();
    }

    function updateActivitySelects() {
      const activityInput = document.getElementById("activityInput");
      const searchActivityName = document.getElementById("searchActivityName");

      if (!activityInput || !searchActivityName) return;

      activityInput.innerHTML = '<option value="">활동 선택</option>';
      searchActivityName.innerHTML = '<option value="">활동 선택</option>';

      for (let activity in activities) {
        activityInput.innerHTML += `<option value="${activity}">${activity}</option>`;
        searchActivityName.innerHTML += `<option value="${activity}">${activity}</option>`;
      }
    }

    loadData();
  </script>

</body>
</html>
